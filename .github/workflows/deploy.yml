name: Deploy to AWS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # 1. Build JARs
    - name: Build JARs
      run: |
        mvn clean package -DskipTests -f monitored-app/pom.xml
        mvn clean package -DskipTests -f monitoring-service/pom.xml

    # 2. Login to Docker Hub (Uses your Secrets)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Build & Push Images
    - name: Build & Push Monitored App
      uses: docker/build-push-action@v5
      with:
        context: ./monitored-app
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/monitored-app:latest

    - name: Build & Push Monitoring Service
      uses: docker/build-push-action@v5
      with:
        context: ./monitoring-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/monitoring-service:latest

    # 4. Copy docker-compose.yml to EC2
    - name: Copy Compose File to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        source: "docker-compose.yml"
        target: "/home/ubuntu/"

    # 5. SSH into EC2 and Restart
    - name: Deploy on EC2
      uses: appleboy/ssh-action@master
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_KEY }}
        envs: SLACK_WEBHOOK_URL
        script: |
          export SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "Secret is MISSING"; else echo "Secret is SET"; fi
          docker-compose pull
          docker-compose up -d
          docker image prune -f